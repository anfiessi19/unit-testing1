name: Linter Check

on:
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.flake8'

jobs:
  lint:
    name: Flake8 Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: |
          flake8 . \
            --max-line-length=100 \
            --exclude=.git,__pycache__,.venv,venv \
            --statistics \
            --count